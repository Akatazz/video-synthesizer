name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project apps/windows/VideoSynthesizer.Checks -c Release
      - run: dotnet build apps/windows/VideoSynthesizer -c Release
      - run: dotnet publish apps/windows/VideoSynthesizer -c Release -r win-x64 --self-contained true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: video-synthesizer-windows-x64
          path: artifacts/windows
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift preset contract
        run: |
          swiftc apps/apple/VideoSynthesizer/SynthParameters.swift apps/apple/VideoSynthesizer/AudioAnalysis.swift apps/apple/Checks/CheckPresets.swift -o /tmp/check-presets
          /tmp/check-presets contracts/presets/classic-feedback.json
      - name: Build macOS application and Metal library
        run: xcodebuild -project apps/apple/VideoSynthesizer.xcodeproj -scheme VideoSynthesizerMac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath artifacts/apple CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS Simulator application and Metal library
        run: xcodebuild -project apps/apple/VideoSynthesizer.xcodeproj -scheme VideoSynthesizerIOS -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/apple CODE_SIGNING_ALLOWED=NO build
      - name: Archive macOS app preserving bundle permissions
        run: ditto -c -k --keepParent artifacts/apple/Build/Products/Release/VideoSynthesizerMac.app artifacts/VideoSynthesizerMac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: video-synthesizer-macos-unsigned
          path: artifacts/VideoSynthesizerMac.zip
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev nlohmann-json3-dev xvfb
      - run: cmake -S apps/linux -B apps/linux/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build apps/linux/build --parallel
      - run: ctest --test-dir apps/linux/build --output-on-failure
      - name: Launch GTK preview
        run: timeout 30s xvfb-run -a apps/linux/build/video-synthesizer --smoke-test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check presets and build APK
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: video-synthesizer-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd apps/android && ./gradlew connectedDebugAndroidTest
